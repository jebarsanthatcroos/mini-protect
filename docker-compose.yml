services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.production
        required: false
    expose:
      - '3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.production
        required: false
    expose:
      - '3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  nginx_cache:
